<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#214a35">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="../0309/manifest.webmanifest">
<link rel="apple-touch-icon" href="../0309/icon-192.png">

<title>My Clivia Collection</title>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
:root{
 --forest:#173d2b;
 --forest2:#28563f;
 --sage:#748b78;
 --cream:#f7f4ed;
 --paper:#fffdf9;
 --sand:#e7dfd0;
 --gold:#b99a61;
 --ink:#20251f;
 --muted:#788078;
 --danger:#9b4038;
 --shadow:0 12px 35px rgba(31,45,35,.08);
 --radius:20px;
}

*{box-sizing:border-box}

html{background:var(--cream)}

body{
 margin:0;
 font-family:Inter,ui-sans-serif,system-ui,-apple-system,
 BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:var(--cream);
 color:var(--ink);
 letter-spacing:.01em
}

button,input,select,textarea{font:inherit}
button{cursor:pointer}

button:disabled{
 opacity:.55;
 cursor:not-allowed
}

header{
 background:var(--forest);
 color:#fff;
 padding:24px 22px 26px;
 position:sticky;
 top:0;
 z-index:20;
 box-shadow:0 5px 22px rgba(0,0,0,.12)
}

.headerrow{
 max-width:980px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:20px
}

.brand{
 font-family:Georgia,"Times New Roman",serif;
 font-size:27px;
 font-weight:500;
 letter-spacing:.02em
}

.subtitle{
 font-size:11px;
 letter-spacing:.18em;
 text-transform:uppercase;
 opacity:.72;
 margin-top:7px
}

.iconbtn{
 background:transparent;
 border:1px solid rgba(255,255,255,.38);
 color:#fff;
 border-radius:999px;
 padding:9px 15px;
 font-size:12px;
 text-transform:uppercase;
 letter-spacing:.12em
}

main{
 max-width:980px;
 margin:auto;
 padding:30px 20px 115px
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:14px;
 margin-bottom:36px
}

.stat{
 background:var(--paper);
 border:1px solid var(--sand);
 border-radius:16px;
 padding:18px;
 text-align:left
}

.stat b{
 font-family:Georgia,serif;
 font-size:30px;
 color:var(--forest);
 display:block;
 font-weight:500
}

.stat span{
 font-size:10px;
 color:var(--muted);
 text-transform:uppercase;
 letter-spacing:.13em
}

h1,h2,h3{
 font-family:Georgia,"Times New Roman",serif;
 font-weight:500;
 color:var(--forest)
}

h2{
 font-size:22px;
 margin:30px 0 16px
}

.folders{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:18px
}

.folder{
 position:relative;
 background:var(--paper);
 border:1px solid var(--sand);
 border-radius:24px;
 padding:26px 22px;
 text-align:left;
 box-shadow:var(--shadow);
 cursor:pointer;
 transition:.2s
}

.folder:hover{
 transform:translateY(-3px);
 box-shadow:0 18px 42px rgba(31,45,35,.12)
}

.letterAvatar{
 display:flex!important;
 align-items:center;
 justify-content:center;
 min-width:0!important;
 width:100%;
 aspect-ratio:1/1;
 height:auto!important;
 padding:18px!important;
 border-radius:17px!important;
 font-family:Georgia,serif;
 font-size:30px!important;
 font-weight:500!important;
 color:var(--forest)!important;
 margin:0 0 22px!important;
 border:0!important
}

.folder b{
 display:block;
 font-family:Georgia,serif;
 font-size:22px;
 font-weight:500;
 margin:0 0 7px
}

.folder small{
 color:var(--muted);
 font-size:12px
}

.primary{
 background:var(--forest);
 color:#fff;
 border:0;
 border-radius:999px;
 padding:13px 20px;
 font-weight:600;
 letter-spacing:.03em
}

.primary:hover{
 background:var(--forest2)
}

.secondary{
 background:transparent;
 border:1px solid var(--sand);
 color:var(--forest);
 border-radius:999px;
 padding:10px 15px;
 font-weight:600
}

.danger{
 color:#fff;
 background:var(--danger);
 border:0;
 border-radius:999px;
 padding:9px 13px
}

.google{
 background:#fff;
 color:#222;
 border:1px solid var(--sand);
 border-radius:999px;
 padding:13px 18px;
 font-weight:600;
 width:100%
}

.homeActions{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin-bottom:30px
}

.homeActions button{
 width:100%;
 white-space:nowrap
}

.subcard{
 position:relative
}

.subAdd{
 margin-top:13px;
 width:100%;
 padding:10px 12px;
 border:1px solid var(--sand);
 border-radius:999px;
 background:transparent;
 color:var(--forest);
 font-weight:600;
 font-size:11px
}

.categoryName{
 display:flex;
 align-items:flex-start;
 justify-content:space-between;
 gap:10px
}

.categoryNums{
 font-size:10px;
 color:var(--muted);
 line-height:1.4;
 text-align:right
}

.measurementLabel{
 font-size:10px;
 color:var(--muted);
 margin-top:5px
}

.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 background:rgba(255,253,249,.96);
 backdrop-filter:blur(12px);
 border-top:1px solid var(--sand);
 display:flex;
 justify-content:center;
 gap:12px;
 padding:10px 12px calc(10px + env(safe-area-inset-bottom));
 z-index:30
}

.bottom button{
 border:0;
 background:none;
 color:var(--muted);
 font-size:10px;
 text-transform:uppercase;
 letter-spacing:.11em;
 padding:8px 18px
}

.bottom button strong{
 display:block;
 font-family:Georgia,serif;
 font-size:14px;
 font-weight:500;
 color:var(--forest);
 margin-bottom:2px
}

.hidden{
 display:none!important
}

.panel{
 background:var(--paper);
 border:1px solid var(--sand);
 border-radius:20px;
 padding:20px;
 margin-bottom:15px;
 box-shadow:var(--shadow)
}

.row{
 display:flex;
 gap:10px;
 align-items:center
}

.between{
 justify-content:space-between
}

.field{
 margin:15px 0
}

.field label{
 display:block;
 font-weight:600;
 font-size:11px;
 margin-bottom:7px;
 text-transform:uppercase;
 letter-spacing:.1em;
 color:var(--muted)
}

.field input,
.field select,
.field textarea{
 width:100%;
 padding:13px 14px;
 border:1px solid var(--sand);
 border-radius:12px;
 background:#fff;
 color:var(--ink);
 outline:none
}

.field input:focus,
.field select:focus,
.field textarea:focus,
.search:focus{
 border-color:var(--gold);
 box-shadow:0 0 0 3px rgba(185,154,97,.12)
}

.field textarea{
 min-height:100px;
 resize:vertical
}

.requiredLabel::after{
 content:" *";
 color:var(--danger);
 font-weight:800
}

.photoChoices{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.photoChoice{
 padding:15px;
 border:1px solid var(--sand);
 border-radius:14px;
 background:#fff;
 text-align:center;
 font-weight:600;
 color:var(--forest)
}

.photoGrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
 margin-top:12px
}

.photoBox{
 position:relative
}

.photoGrid img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 border-radius:12px
}

.removePhoto{
 position:absolute;
 top:5px;
 right:5px;
 width:28px;
 height:28px;
 border:0;
 border-radius:50%;
 background:#222c;
 color:#fff
}

.yearHeader{
 background:var(--forest);
 color:#fff;
 padding:11px 14px;
 border-radius:11px;
 margin-top:18px;
 font-size:12px;
 letter-spacing:.08em
}

.plantgrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:16px
}

.galleryGrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px
}

.galleryItem{
 background:var(--paper);
 border:1px solid var(--sand);
 border-radius:18px;
 overflow:hidden;
 box-shadow:0 7px 22px rgba(31,45,35,.06);
 cursor:pointer;
 transition:.2s
}

.galleryItem:hover{
 transform:translateY(-3px);
 box-shadow:0 14px 30px rgba(31,45,35,.12)
}

.galleryItem img{
 display:block;
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 background:#e8e4da
}

.galleryInfo{
 padding:10px 12px 12px
}

.galleryInfo b{
 display:block;
 font-family:Georgia,serif;
 font-size:15px;
 font-weight:500;
 color:var(--forest)
}

.galleryInfo span{
 display:block;
 font-size:11px;
 color:var(--muted);
 margin-top:3px
}

.galleryInfo small{
 display:block;
 font-size:10px;
 color:var(--muted);
 margin-top:4px
}

.plantcard{
 background:var(--paper);
 border:1px solid var(--sand);
 border-radius:18px;
 overflow:hidden;
 width:100%;
 padding:0;
 text-align:left;
 box-shadow:0 7px 22px rgba(31,45,35,.06)
}

.plantcard img{
 width:100%;
 aspect-ratio:1;
 object-fit:cover;
 background:#ebe7de
}

.plantcard .p{
 padding:13px
}

.plantcard b{
 display:block;
 font-family:Georgia,serif;
 font-size:17px;
 font-weight:500;
 color:var(--forest)
}

.plantcard span{
 font-size:13px
}

.plantcard small{
 color:var(--muted);
 font-size:10px
}

.back{
 border:0;
 background:none;
 color:var(--forest);
 font-weight:600;
 padding:0;
 margin-bottom:10px;
 font-size:12px;
 text-transform:uppercase;
 letter-spacing:.08em
}

.crumb{
 font-size:10px;
 text-transform:uppercase;
 letter-spacing:.14em;
 color:var(--muted)
}

.folderTitle{
 font-size:32px;
 margin:7px 0 4px
}

.subgrid{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:16px
}

.subcard{
 background:var(--paper);
 border:1px solid var(--sand);
 border-radius:18px;
 padding:18px;
 cursor:pointer;
 box-shadow:0 7px 22px rgba(31,45,35,.05)
}

.swatch{
 height:64px;
 border-radius:13px;
 margin-bottom:15px;
 border:1px solid rgba(0,0,0,.05)
}

.subcard b{
 font-family:Georgia,serif;
 font-size:18px;
 font-weight:500;
 color:var(--forest)
}

.count{
 font-size:11px;
 color:var(--muted);
 margin-top:5px
}

.search{
 width:100%;
 padding:14px;
 border:1px solid var(--sand);
 border-radius:999px;
 margin-bottom:18px;
 background:var(--paper);
 outline:none
}

.toast{
 position:fixed;
 bottom:78px;
 left:50%;
 transform:translateX(-50%);
 background:var(--forest);
 color:#fff;
 padding:11px 16px;
 border-radius:999px;
 z-index:150;
 max-width:90%;
 text-align:center;
 font-size:12px
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(20,29,23,.52);
 backdrop-filter:blur(4px);
 display:flex;
 align-items:flex-end;
 justify-content:center;
 z-index:40
}

.modalbox{
 background:var(--cream);
 width:100%;
 max-width:720px;
 max-height:94vh;
 overflow:auto;
 border-radius:28px 28px 0 0;
 padding:24px;
 box-shadow:0 -10px 45px rgba(0,0,0,.18)
}

.manageitem{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:13px 0;
 border-bottom:1px solid var(--sand);
 gap:8px
}

.empty{
 text-align:center;
 padding:45px 10px;
 color:var(--muted);
 font-size:13px
}

.user{
 display:flex;
 align-items:center;
 gap:12px;
 background:var(--paper);
 border:1px solid var(--sand);
 padding:14px;
 border-radius:16px;
 margin-bottom:15px
}

.user img{
 width:42px;
 height:42px;
 border-radius:50%
}

.yearPill{
 display:inline-block;
 background:#eef2ec;
 color:var(--forest);
 padding:4px 8px;
 border-radius:999px;
 font-size:10px;
 margin-top:6px
}

.sync{
 background:#eef2ec;
 border:1px solid #d6e0d5;
 border-radius:14px;
 padding:13px;
 margin:12px 0;
 font-size:12px
}

.sync.ok{
 color:#205b35
}

.sync.bad{
 background:#fbefed;
 color:#8b302a
}

.photoStorageNote{
 background:#eef2ec;
 border:1px solid #d6e0d5;
 border-radius:12px;
 padding:11px;
 margin-top:12px;
 font-size:11px;
 color:#45604d;
 line-height:1.45
}

.saveStatus{
 margin-top:10px;
 font-size:11px;
 color:var(--muted);
 text-align:center;
 min-height:16px
}

/* REAL CAMERA */

.cameraScreen{
 position:fixed;
 inset:0;
 z-index:100;
 background:#000;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center
}

.cameraVideo{
 width:100%;
 height:100%;
 object-fit:cover;
 background:#000
}

.cameraControls{
 position:absolute;
 bottom:0;
 left:0;
 right:0;
 padding:20px 20px calc(20px + env(safe-area-inset-bottom));
 display:flex;
 justify-content:center;
 align-items:center;
 gap:25px;
 background:linear-gradient(
  transparent,
  rgba(0,0,0,.78)
 )
}

.cameraCancel{
 width:60px;
 height:60px;
 border:0;
 border-radius:50%;
 background:#555;
 color:#fff;
 font-size:27px
}

.cameraShutter{
 width:78px;
 height:78px;
 border:5px solid #fff;
 border-radius:50%;
 background:#fff;
 box-shadow:0 0 0 4px rgba(255,255,255,.35)
}

.cameraHint{
 position:absolute;
 top:18px;
 left:50%;
 transform:translateX(-50%);
 background:rgba(0,0,0,.55);
 color:#fff;
 padding:8px 13px;
 border-radius:999px;
 font-size:11px;
 z-index:2
}

@media(max-width:720px){

 .homeActions{
  grid-template-columns:1fr
 }

 .folders,
 .subgrid{
  grid-template-columns:1fr
 }

 .plantgrid,
 .galleryGrid{
  grid-template-columns:repeat(2,1fr)
 }

 .stats{
  gap:8px
 }

 .stat{
  padding:13px
 }

 .stat b{
  font-size:24px
 }

 .brand{
  font-size:23px
 }

 main{
  padding:24px 15px 110px
 }

 .bottom{
  gap:0
 }

 .bottom button{
  padding:8px 6px;
  font-size:9px;
  letter-spacing:.06em
 }

 .row{
  flex-wrap:wrap
 }

}

@media(min-width:721px){

 .modal{
  align-items:center
 }

 .modalbox{
  border-radius:24px
 }

}
</style>
</head>

<body>

<header>
<div class="headerrow">

<div>
<div class="brand">My Clivia Collection</div>
<div class="subtitle">
A considered record of your Clivia collection
</div>
</div>

<button
 class="iconbtn"
 type="button"
 onclick="settingsView()"
 aria-label="Settings"
 title="Settings">
 ⚙
</button>

</div>
</header>

<main id="app"></main>

<nav class="bottom">

<button type="button" onclick="home()">
 Home
</button>

<button type="button" onclick="collection()">
 Collection
</button>

<button type="button" onclick="openPlant()">
 Add Plant
</button>

<button type="button" onclick="photoGallery()">
 Photo Gallery
</button>

<button type="button" onclick="searchView()">
 Search
</button>

</nav>

<div id="modal" class="modal hidden">
<div class="modalbox" id="modalbox"></div>
</div>


<script>

/* =========================================================
   GOOGLE
========================================================= */

const GOOGLE_CLIENT_ID =
 "153586094533-d46j0o7md4irhou4sj2q43ii4fkait3q.apps.googleusercontent.com";

const DRIVE_SCOPE =
 "https://www.googleapis.com/auth/drive.file";

const KEY =
 "cliviaCatalogueV3";


/* =========================================================
   APP STATE
========================================================= */

const appEl =
 document.getElementById("app");

const modalEl =
 document.getElementById("modal");

const modalboxEl =
 document.getElementById("modalbox");

let accessToken=null;
let googleUser=null;
let tokenExpiresAt=null;
let googleTokenClient=null;

let newPhotos=[];
let originalPhotoFiles={};

let photosProcessing=false;
let plantSaving=false;


/* =========================================================
   CAMERA STATE
========================================================= */

let cameraStream=null;
let cameraTarget="new";
let cameraPlantId=null;


/* =========================================================
   LOAD DATA
========================================================= */

let data;

try{

 data=JSON.parse(
  localStorage.getItem(KEY)||"null"
 );

}catch(e){

 console.error(
  "Could not read catalogue:",
  e
 );

 data=null;

}


if(
 !data ||
 !Array.isArray(data.folders) ||
 !Array.isArray(data.plants)
){

 data={
  folders:[],
  plants:[]
 };

}


data.plants=
 Array.isArray(data.plants)
 ?data.plants
 :[];


/* =========================================================
   COLOUR CATEGORIES
========================================================= */

const COLOUR_SUBS=[
 "Apricot",
 "Bronze",
 "Green",
 "Orange",
 "Orange Dark",
 "Orange Light",
 "Peach",
 "Peach Dark",
 "Peach Light",
 "Pink",
 "Red",
 "Salmon",
 "Yellow",
 "Yellow Dark",
 "Yellow Light",
 "Versi Colour",
 "Bi-Tone",
 "Bi-Colour"
];


const COLOUR_NUMBERS={

 "Apricot":"27, 29–30, 35–38, 70",
 "Bronze":"21–23, 25, 28",
 "Green":"91–100",
 "Orange":"24, 26",
 "Orange Dark":"11–18",
 "Orange Light":"69",
 "Peach":"67–68",
 "Peach Dark":"31–34, 79–80",
 "Peach Light":"39–40, 53, 55, 71–74",
 "Pink":"42–52, 54, 56, 58",
 "Red":"1–10",
 "Salmon":"19–20, 41",
 "Yellow":"64, 81–85, 90",
 "Yellow Dark":"66, 86–89",
 "Yellow Light":"57, 59–63, 65"

};


const MAIN_FOLDER_NAMES=[
 "Miniata",
 "Gardenii",
 "Nobilis",
 "Caulescens",
 "Robusta",
 "Interspec",
 "Broad Leaf",
 "Akebono",
 "Tiger",
 "Mandarin Duck",
 "LOB"
];


const MEASUREMENT_FOLDERS=new Set([
 "Broad Leaf",
 "Akebono",
 "Tiger",
 "Mandarin Duck",
 "LOB"
]);


/* =========================================================
   NORMALISE FOLDERS
========================================================= */

const oldFolders=
 Array.isArray(data.folders)
 ?data.folders
 :[];


const oldByName=new Map(
 oldFolders.map(
  f=>[
   String(f?.name||"").trim().toLowerCase(),
   f
  ]
 )
);


data.folders=
 MAIN_FOLDER_NAMES.map(
  name=>{

   const old=
    oldByName.get(
     name.toLowerCase()
    );


   if(
    MEASUREMENT_FOLDERS.has(name)
   ){

    const oldSubs=
     Array.isArray(old?.subs)
     ?
     old.subs
      .map(String)
      .filter(Boolean)
     :
     [];


    const measured=[
     ...new Set(
      data.plants
       .filter(
        p=>
         p.folder===name &&
         p.sub
       )
       .map(
        p=>String(p.sub)
       )
     )
    ];


    return {

     name,

     subs:[
      ...new Set([
       ...oldSubs,
       ...measured
      ])
     ]

    };

   }


   return {

    name,

    subs:[
     ...COLOUR_SUBS
    ]

   };

  }
 );


for(const f of oldFolders){

 const n=
  String(f?.name||"").trim();


 if(
  n &&
  !MAIN_FOLDER_NAMES.some(
   x=>
    x.toLowerCase()===
    n.toLowerCase()
  )
 ){

  data.folders.push({

   name:n,

   subs:
    Array.isArray(f.subs)
    ?
    f.subs.map(String).filter(Boolean)
    :
    []

  });

 }

}


save();


/* =========================================================
   SAFE STORAGE
========================================================= */

function save(){

 try{

  const json=
   JSON.stringify(data);

  const bytes=
   new Blob([json]).size;

  console.log(
   "Catalogue storage:",
   (bytes/(1024*1024)).toFixed(2),
   "MB"
  );

  localStorage.setItem(
   KEY,
   json
  );

  const verify=
   localStorage.getItem(KEY);

  if(verify!==json)
   throw new Error(
    "Storage verification failed"
   );

  return true;

 }catch(e){

  console.error(
   "Storage error:",
   e
  );

  if(
   e &&
   (
    e.name==="QuotaExceededError" ||
    e.code===22 ||
    e.code===1014
   )
  ){

   toast(
    "Storage is full. Remove some photos or use Google Drive backup."
   );

  }else{

   toast(
    "Could not save the catalogue."
   );

  }

  return false;

 }

}


/* =========================================================
   HELPERS
========================================================= */

function esc(s=""){

 return String(s).replace(
  /[&<>"']/g,
  c=>({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#39;"
  }[c])
 );

}


function uid(){

 if(
  typeof crypto!=="undefined" &&
  crypto.randomUUID
 ){

  return crypto.randomUUID();

 }

 return Date.now()+
  "-"+
  Math.random()
   .toString(36)
   .slice(2);

}


/* =========================================================
   COLOURS
========================================================= */

const COLORS={

 yellow:"#F4D35E",
 gold:"#C9A227",
 orange:"#F28C28",
 peach:"#F7B7A3",
 apricot:"#F4A261",
 bronze:"#9A6A3A",
 red:"#D95D5D",
 pink:"#E88CB7",
 green:"#62A85A",
 white:"#EDEDE7",
 cream:"#E8D7B5",
 salmon:"#E98272"

function folderInitials(n){

  n.trim()

   .filter(Boolean)
   .map(
    w=>

     ?
     w
     :
     w[0].toUpperCase()
   )
   .join("")||"?"
 );

}


function folderBg(n,i){

 let l=n.toLowerCase();


 if(l==="versi colour")
  return "linear-gradient(135deg,#D95D5D 0 33%,#F4D35E 33% 66%,#62A85A 66% 100%)";


 if(l==="bi-tone")
  return "linear-gradient(135deg,#173d2b 0 50%,#C9A227 50% 100%)";


 if(l==="bi-colour")
  return "linear-gradient(135deg,#E88CB7 0 50%,#F28C28 50% 100%)";


 let keys=
  Object.keys(COLORS)
   .filter(
    k=>
     l.includes(k.toLowerCase())
   );


 if(
  l.includes("gt") &&
  !keys.includes("green")
 )
  keys.push("green");


 if(!keys.length){

  return [
   "#CFE2FF",
   "#CDECCB",
   "#E6D3F2",
   "#FFE49A",
   "#D9B38C",
   "#BFE3DD",
   "#D8D8D8",
   "#C9D8F0",
   "#E5C5D8",
   "#F1D2B0",
   "#C5D8C2"
  ][i%11];

 }


 if(keys.length===1)
  return COLORS[keys[0]];


 return "linear-gradient(90deg,"+
  keys.map(
   (k,j)=>
    COLORS[k]+" "+
    (j*100/keys.length)+"%,"+
    COLORS[k]+" "+
    ((j+1)*100/keys.length)+"%"
  ).join(",")+
  ")";

}


function plantCount(f,s){

/* =========================================================
   IMAGE COMPRESSION
========================================================= */

function compressImage(file){

 return new Promise(
  (resolve,reject)=>{

   if(!file){

    reject(
     new Error("No image file")
    );

    return;

   }


   const reader=
    new FileReader();


   reader.onload=function(e){

    const img=
     new Image();


    img.onload=function(){

     const MAX_SIZE=1200;


     let width=img.width;
     let height=img.height;


     if(
      width>MAX_SIZE ||
      height>MAX_SIZE
     ){

      if(width>height){

       height=
        Math.round(
         height*MAX_SIZE/width
        );

       width=MAX_SIZE;

      }else{

       width=
        Math.round(
         width*MAX_SIZE/height
        );

       height=MAX_SIZE;

      }

     }


     const canvas=
      document.createElement("canvas");


     canvas.width=width;
     canvas.height=height;


     const ctx=
      canvas.getContext(
       "2d",
       {alpha:false}
      );


     if(!ctx){

      reject(
       new Error("Canvas unavailable")
      );

      return;

     }


     ctx.drawImage(
      img,
      0,
      0,
      width,
      height
     );


     resolve(
      canvas.toDataURL(
       "image/jpeg",
       .70
      )
     );

    };


    img.onerror=function(){

     reject(
      new Error(
       "Image could not be loaded"
      )
     );

    };


    img.src=e.target.result;

   };


   reader.onerror=function(){

    reject(
     new Error(
      "File could not be read"
     )
    );

   };


   reader.readAsDataURL(file);

  }
 );

}

/* =========================================================
   TAKE CAMERA PHOTO
========================================================= */

async function takeCameraPhoto(){

 if(!cameraStream){

  toast(
   "Camera is not ready."
  );

  return;

 }


 const video=
  document.getElementById(
   "cameraVideo"
  );


 if(!video){

  toast(
   "Camera preview is unavailable."
  );

  return;

 }


 if(
  !video.videoWidth ||
  !video.videoHeight
 ){

  toast(
   "Camera is still starting. Please try again."
  );

  return;

 }


 try{

  const canvas=
   document.createElement(
    "canvas"
   );


  canvas.width=
   video.videoWidth;


  canvas.height=
   video.videoHeight;


  const ctx=
   canvas.getContext("2d");


  if(!ctx)
   throw new Error(
    "Canvas unavailable"
   );


  ctx.drawImage(
   video,
   0,
   0,
   canvas.width,
   canvas.height
  );


  const blob=
   await new Promise(
    (resolve,reject)=>{

     canvas.toBlob(
      b=>{

       if(b)
        resolve(b);
       else
        reject(
         new Error(
          "Could not create photograph"
         )
        );

      },
      "image/jpeg",
      .92
     );

    }
   );


  const file=
   new File(
    [blob],
    `Clivia-Camera-${Date.now()}.jpg`,
    {
     type:"image/jpeg"
    }
   );


  const target=
   cameraTarget;


  const pid=
   cameraPlantId;


  closeCamera();


  if(target==="new"){

   await processCameraFile(
    file
   );

   return;

  }


  if(target==="year"){

   await processYearCameraFile(
    file,
    pid
   );

  }


 }catch(error){

  console.error(
   "Taking camera photo failed:",
   error
  );


  toast(
   "Could not take the photograph."
  );

 }

}

/* =========================================================
   FIRST PHOTO
========================================================= */

function firstPhoto(p){

 const photos=
  (p.photos||[])
   .filter(
    x=>x&&x.data
   );


 if(!photos.length)
  return "";


 return photos
  .slice()
  .sort(
   (a,b)=>{

    const ya=Number(a.year)||0;
    const yb=Number(b.year)||0;


    if(yb!==ya)
     return yb-ya;


    return (
     (Number(b.addedAt)||0)-
     (Number(a.addedAt)||0)
    );

   }
  )[0].data;

}

  if(
   MEASUREMENT_FOLDERS.has(nf)
  ){

   if(!nl||!nb){

    toast(
     "Enter leaf length and breadth"
    );

    return;

   }


   ns=
    `${Number(nl)} × ${Number(nb)} cm`;


   const ff=
    data.folders.find(
     x=>x.name===nf
    );


   if(
    ff &&
    !ff.subs.includes(ns)
   )
    ff.subs.push(ns);

  }


  const oldData=
   JSON.stringify(p);


  Object.assign(
   p,
   {

    number:newNumber,


    name:
     document.getElementById(
      "pname"
     ).value.trim(),


    folder:nf,

    sub:ns,


    leafLength:nl,

    leafBreadth:nb,


    breeder:
     document.getElementById(
      "breeder"
     ).value.trim(),


    parentage:
     document.getElementById(
      "parentage"
     ).value.trim(),


    acq:
     document.getElementById(
      "acq"
     ).value,


    flower:
     document.getElementById(
      "flower"
     ).value,


    notes:
     document.getElementById(
      "notes"
     ).value.trim(),


    photos:
     newPhotos.map(
      x=>({...x})
     )

   }
  );


  if(!save()){

   Object.assign(
    p,
    JSON.parse(oldData)
   );


   toast(
    "Plant could not be updated."
   );


   return;

  }


  newPhotos=[];


  closeModal();


  home();


  toast(
   "Plant updated successfully"
  );


  if(googleUser)
   uploadPlantPhotos(p);


 }finally{

  plantSaving=false;


  if(button)
   button.disabled=false;

 }

}

/* =========================================================
   DRIVE ACCESS
========================================================= */

function ensureDriveAccess(force=false){

 return new Promise(
  (resolve,reject)=>{

   if(
    hasLiveDriveAccess() &&
    !force
   )
    return resolve(accessToken);


   if(!googleTokenClient){

    reject(
     new Error(
      "Google not ready"
     )
    );

    return;

   }


   const old=
    googleTokenClient.callback;


   googleTokenClient.callback=
    r=>{

     googleTokenClient.callback=
      old;


     if(r.error){

      reject(
       new Error(r.error)
      );

      return;

     }


     accessToken=
      r.access_token;


     tokenExpiresAt=
      Date.now()+
      (
       Number(
        r.expires_in||3000
       )*1000
      );


     resolve(accessToken);

    };


   googleTokenClient
    .requestAccessToken({

     prompt:
      force
      ?
      "consent"
      :
      ""

    });

  }
 );

}


async function driveRequest(
 url,
 options={}
){

 const token=
  await ensureDriveAccess(false);


 const r=
  await fetch(
   url,
   {
    ...options,

    headers:{
     ...(options.headers||{}),

     Authorization:
      "Bearer "+token

    }

   }
  );


 if(!r.ok)
  throw new Error(
   await r.text()
  );


 return r;

}


/* =========================================================
   DRIVE FOLDERS
========================================================= */

async function findDriveFolder(
 name,
 parentId
){

 let q=
  `name='${String(name)
   .replace(/'/g,"\\'")}' `+
  `and mimeType='application/vnd.google-apps.folder' `+
  `and trashed=false`;


 if(parentId)
  q+=
   ` and '${parentId}' in parents`;


 const r=
  await driveRequest(
   "https://www.googleapis.com/drive/v3/files?"+
   new URLSearchParams({

    q,

    fields:"files(id,name)",

    pageSize:"10"

   })
  );


 const j=
  await r.json();


 return j.files?.[0]||null;

}


async function createDriveFolder(
 name,
 parentId
){

 const body={

  name,

  mimeType:
   "application/vnd.google-apps.folder"

 };


 if(parentId)
  body.parents=[parentId];


 const r=
  await driveRequest(
   "https://www.googleapis.com/drive/v3/files",
   {

    method:"POST",

    headers:{
     "Content-Type":
      "application/json"
    },

    body:
     JSON.stringify(body)

   }
  );


 return r.json();

}


async function getOrCreateDriveFolder(
 name,

){

 return await findDriveFolder(

/* =========================================================
   DRIVE TEXT FILE
========================================================= */

async function upsertDriveTextFile(
 name,
 parentId,
 text
){

 const q=
  `name='${name}' and trashed=false and '${parentId}' in parents`;


 const r=
  await driveRequest(
   "https://www.googleapis.com/drive/v3/files?"+
   new URLSearchParams({

    q,

    fields:"files(id,name)",

    pageSize:"1"

   })
  );


 const j=
  await r.json();


 const file=
  j.files?.[0];


 if(file){

  return driveRequest(
   `https://www.googleapis.com/upload/drive/v3/files/${file.id}?uploadType=media`,
   {

    method:"PATCH",

    headers:{
     "Content-Type":
      "text/plain"
    },

    body:text

   }
  ).then(
   x=>x.json()
  );

 }


 const meta={

  name,

  parents:[parentId],

  mimeType:"text/plain"

 };


 const boundary=
  "clivia"+
  Date.now();


 const body=
  `--${boundary}\r\n`+
  `Content-Type: application/json; charset=UTF-8\r\n\r\n`+
  `${JSON.stringify(meta)}\r\n`+
  `--${boundary}\r\n`+
  `Content-Type: text/plain\r\n\r\n`+
  `${text}\r\n`+
  `--${boundary}--`;


 return driveRequest(
  "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",
  {

   method:"POST",

   headers:{
    "Content-Type":
     "multipart/related; boundary="+
     boundary
   },

   body

  }
 ).then(
   x=>x.json()
 );

}


/* =========================================================
   DRIVE PHOTO UPLOAD
========================================================= */

async function uploadPhotoToDrive(
 blob,
 p,
 year
){

 const base=
  await getPlantBaseFolder(p);


 const yf=
  await getOrCreateDriveFolder(
   String(year),
   base.id
  );


 const meta={

  name:
   blob.name||
   `Clivia-${Date.now()}.jpg`,

  parents:[yf.id]

 };


 const boundary=
  "clivia"+
  Date.now();


 const head=
  `--${boundary}\r\n`+
  `Content-Type: application/json; charset=UTF-8\r\n\r\n`+
  `${JSON.stringify(meta)}\r\n`+
  `--${boundary}\r\n`+
  `Content-Type: ${
   blob.type||
   "image/jpeg"
  }\r\n\r\n`;


 const tail=
  `\r\n--${boundary}--`;


 const bytes=
  await blob.arrayBuffer();


 const enc=
  new TextEncoder();


 const body=
  new Blob([
   enc.encode(head),
   bytes,
   enc.encode(tail)
  ]);


 const r=
  await driveRequest(
   "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name",
   {

    method:"POST",

    headers:{
     "Content-Type":
      "multipart/related; boundary="+
      boundary
    },

    body

   }
  );


 return r.json();

}


/* =========================================================
   UPLOAD PLANT PHOTOS
========================================================= */

async function uploadPlantPhotos(p){

 try{

  await ensureDriveAccess(false);


  const base=
   await getPlantBaseFolder(p);


  await upsertDriveTextFile(
   "Details.txt",
   base.id,
   plantDetailsText(p)
  );


  for(
   const photo of p.photos||[]
  ){

   if(photo.synced)
    continue;


   let original=
    originalPhotoFiles[
     photo.id
    ];


   let blob=null;


   if(original){

    blob=original;

    console.log(
     "Uploading ORIGINAL:",
     photo.name
    );


   }else{

    blob=
     dataURLtoBlob(
      photo.data
     );

    console.log(
     "Uploading catalogue copy:",
     photo.name
    );

   }


   if(!blob)
    continue;


   const r=
    await uploadPhotoToDrive(
     blob,
     p,
     photo.year
    );


   photo.synced=true;


   photo.driveFileId=
    r.id;


   delete originalPhotoFiles[
    photo.id
   ];

  }


  save();


  toast(
   "Drive backup updated"
  );


 }catch(e){

  console.error(
   "Drive upload error:",
   e
  );


  toast(
   "Saved locally. Drive upload failed; use Sync later."
  );

 }

}


/* =========================================================
   DATA URL → BLOB
========================================================= */

function dataURLtoBlob(u){

 if(!u)
  return null;


 const a=u.split(",");


 const m=
  (
   a[0].match(
    /:(.*?);/
   )||[]
  )[1]||
  "image/jpeg";


 const b=atob(a[1]);


 const x=
  new Uint8Array(
   b.length
  );


 for(
  let i=0;
  i<b.length;
  i++
 )
  x[i]=
   b.charCodeAt(i);


 return new Blob(
  [x],
  {type:m}
 );

}


/* =========================================================
   DRIVE CATALOGUE SYNC
========================================================= */

async function cloneCatalogueToDrive(){

 if(!googleUser){

 try{

  await ensureDriveAccess(false);


  toast(
   "Building Drive folders..."
  );


  const root=
   await getOrCreateDriveFolder(
    "My Clivia Collection"
   );


  for(
   const f of data.folders
  ){

   const main=
    await getOrCreateDriveFolder(
     f.name,
     root.id
    );


   for(
    const s of f.subs
   ){

    await getOrCreateDriveFolder(
     s,
     main.id
    );

   }

  }


  for(
   const p of data.plants
  ){

   await uploadPlantPhotos(p);

  }


  toast(
   "Google Drive sync complete"
  );


  accountView();


 }catch(e){

  console.error(
   "Drive sync failed:",
   e
  );


  toast(
   "Drive sync failed"
  );

 }

}
